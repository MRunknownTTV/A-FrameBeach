<html>
  <head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <a href="./sound.html"></a>
    <script src="script.js" defer></script>
  </head>
  <body>
    <!-- zorgt dat ik a-frame kan gebruiken -->
    <a-scene>
        <!-- zorgt dat ik iets kan forceren naar me camera te blijven kijken. -->
        <a-camera id="camera"></a-camera>



        <!-- floor and decoration -->

        <!-- zorgt dat ik een object heb (specifiek een doos) -->
      <a-box position="0 0 0" rotation="90  0 0" width="20" height="20" color="#FCFC9F"></a-box>
      
        <!-- sea -->
      <a-box position="0 0 -15" rotation="90  0 0" width="20" height="10" color="#0A76C9"></a-box>

      <!-- building -->
      <a-box  position="0 5 20" rotation="0 0 15" width="10" height="80" color="#A19F6C" ></a-box>

      <!-- tree -->
       
        <!-- tree stamp -->
        <a-cylinder position="-2.8 0 -4.7" rotation="0 0 0" radius="0.08" height="6" color="#6B3709"></a-cylinder>
         
        <!-- tree leafs -->
         <a-plane position="-2.8 3 -4.7" rotation="90 0 0" width="0.6" height="1.8" color="#3C6B09"></a-plane>
         <a-circle position="-2.8 3 -3.8" rotation="90 0 0" radius="0.304" color="#3C6B09"></a-circle>
         <a-circle position="-2.8 3 -5.6" rotation="90 0 0" radius="0.304" color="#3C6B09"></a-circle>

          <a-plane position="-2.8 3 -4.7" rotation="90 0 90" width="0.6" height="1.8" color="#3C6B09"></a-plane>
         <a-circle position="-3.7 3 -4.7" rotation="90 0 90" radius="0.304" color="#3C6B09"></a-circle>
         <a-circle position="-1.9 3 -4.7" rotation="90 0 90" radius="0.304" color="#3C6B09"></a-circle>

         <a-plane position="-2.8 3 -4.7" rotation="90 0 45" width="0.6" height="1.9" color="#3C6B09"></a-plane>
         <a-circle position="-3.41 3 -4.09" rotation="90 0 45" radius="0.309" color="#3C6B09"></a-circle>
         <a-circle position="-2.19 3 -5.31" rotation="90 0 45" radius="0.309" color="#3C6B09"></a-circle>   
         
         <a-plane position="-2.8 3 -4.7" rotation="90 0 -45" width="0.6" height="1.9" color="#3C6B09"></a-plane>
         <a-circle position="-2.19 3 -4.09" rotation="90 0 -45" radius="0.309" color="#3C6B09"></a-circle>
         <a-circle position="-3.41 3 -5.31" rotation="90 0 -45" radius="0.309" color="#3C6B09"></a-circle>   


         <!-- handoek -->
          <a-plane position="-1.8 0.501 -4" rotation="-90 0 0" width="1.5" height="3" color="#FF0000"></a-plane>

        <!-- Schip asset -->
         <a-assets>
          <a-asset-item id="ship-medium.obj" src="./assets/kenney_pirate-kit/Models/OBJ format/ship-medium.obj"></a-asset-item>

          <a-mixin id="giant" scale="5 5 5"></a-mixin>
          <audio id="shipSound" src="./sound-effects/joelfazhari-wooden-ship-interior-ambience-3min-loop-361505.mp3" preload="auto"></audio>
          <img id="ship-texture" src="./assets/kenney_pirate-kit/Models/OBJ format/Textures/colormap.png"></img>
        </a-assets>

        <!-- Schip scene -->
         <a-entity obj-model="obj: #ship-medium.obj" position="-5 0 -14" rotation="0 90 0" animation="property: position; to: 5 0 -14; dur: 12000; easing: linear; loop: true" material="src: #ship-texture"></a-entity>
         <a-sound src="#shipSound" autoplay="true"></a-sound>


         <!-- Button animatie -->

        
<!-- Paaltje van de nachtknop -->
<a-cylinder
  position="2 0.6 -4" radius="0.08" height="1.2" color="#6B3709"></a-cylinder>

<!-- Knopkastje boven op het paaltje -->
<a-box
  id="nightButton3D"
  position="2 1.3 -4" width="0.65" height="0.4" depth="0.35" color="#222222" class="clickable"></a-box>

<!-- Tekst op het kastje -->
<a-text
  value="DAG / NACHT"
  position="2 1.3 -3.81" rotation="0 0 0" width="2" color="#FFFFFF" align="center"></a-text>

         <!-- sun and tekst -->

            <!-- zorgt dat ik een object heb (specifiek een sphere) -->
      <a-sphere
  id="sun" light="type: ambient; color: #FFFFFF;" color="#FFF000" position="-30 25 -35" radius="5"></a-sphere>



<!-- Maan onzichtbaar -->
<a-sphere
  id="moon"
  position="-30 25 -35" light="type: directional; color: #FFFFFF intensity: 0.5" radius="3" color="#E6EAF2" material="emissive: #AABBDD; emissiveIntensity: 0.3" visible="false"></a-sphere>

      <!-- veranderd de achtergrond naar de specifieke kleur of afbeelding -->
      <a-sky color="#6BD0FF"></a-sky>

      <!-- zorgt dat je een stukje tekst kan zien. -->
      <!-- <a-text 
      value="Hello, World!" 
      color="#FFFFFF" 
      position="-1 2 -5"
      scale="2 2 2">
     </a-text> -->


<a-camera>
  <a-cursor
    color="#FFFFFF" raycaster="objects: .clickable"></a-cursor>
</a-camera>

    </a-scene>
  </body>
</html>
